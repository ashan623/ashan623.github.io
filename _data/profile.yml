intro: >-
  I am a master's student in Financial Computing at Xi'an Jiaotong-Liverpool University. My research interests lie at the intersection of information retrieval, multimodal representation learning, and agentic systems. Before returning to graduate study, I worked as a software engineer at the State Taxation Administration of Dali Prefecture.

collaboration: >-
  I am open to collaborations and discussions on information retrieval, multimodal embeddings, and agentic search. Please feel free to reach out if you are interested in related topics.

interests:
  - "Fine-grained Retrieval"
  - "Omni-modal Embeddings"
  - "Agentic Search"

research:
  - title: "Fine-grained retrieval and efficient ranking"
    body: >-
      I study retrieval for complex information needs, including tool retrieval and fine-grained cross-modal retrieval. A recurring goal is to improve ranking quality while reducing the inference cost of the retriever and reranker.
  - title: "Omni-modal embeddings"
    body: >-
      I explore unified representation spaces for text, images, audio, video, documents, and tools. My work covers alignment training, benchmark design, and evaluation pipelines for measuring cross-modal semantic consistency.
  - title: "Agentic search"
    body: >-
      I investigate search systems for agents that must plan over multiple steps, call heterogeneous tools, gather evidence from multiple sources, and use external feedback to solve complex tasks end to end.

